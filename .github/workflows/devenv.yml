name: devenv

on:
  workflow_call:

env:
  CONTAINER: docker

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Log in to the registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Pull the devenv, or build and push it
      run: |
        make devenv-pull || { make devenv && make devenv-push; }
