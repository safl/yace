---
name: verify_and_publish

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version: '3.12'

    - name: Install pre-commit
      run: |
        pipx install pre-commit --python python3
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run pre-commit
      run: |
        make format-all

  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version: '3.12'

    - name: Build tools
      run: |
        make deps
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build the sdist and wheel
      run: |
        make build

    - name: Upload the build
      uses: actions/upload-artifact@v6.0.0
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  devenv:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devenv.yml

  unittest-linux:
    needs: [format, build, devenv]
    runs-on: ubuntu-24.04
    env:
      CONTAINER: docker
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Download the build
      uses: actions/download-artifact@v7.0.0
      with:
        name: dist
        path: dist/

    - name: Log in to the registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Install the build and test it, in the devenv
      run: |
        make devenv-run CMD="make install test PYTHON=python${{ matrix.python-version }}"

  unittest-macos:
    needs: [format, build]
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download the build
      uses: actions/download-artifact@v7.0.0
      with:
        name: dist
        path: dist/

    - name: Install Zig
      uses: mlugg/setup-zig@v2.2.1
      with:
        version: 0.16.0
        use-cache: false

    - name: Install the build and test it
      run: |
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        make install test

  example:
    needs: [format, build, devenv]
    runs-on: ubuntu-24.04
    env:
      CONTAINER: docker
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Download the build
      uses: actions/download-artifact@v7.0.0
      with:
        name: dist
        path: dist/

    - name: Log in to the registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Parse libfoo strictly, emit its bindings, and build and run their checks, in the devenv
      run: |
        make devenv-run CMD="make install example"

    - name: Upload the emitted code
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: example-output
        path: output/
        if-no-files-found: ignore
