name: verify_and_publish

# Every pull request runs this workflow, as main requires its job 'ci-result'.
# A change of only docs/ and Markdown files skips the jobs that build and test.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1
      with:
        fetch-depth: 0

    - name: Classify the change as docs only, or not
      id: classify
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        docs_only=false
        if [ -n "$BASE" ]; then
          git diff --name-only --no-renames "$BASE...HEAD" | tee changed.txt
          if [ -s changed.txt ] && ! grep -qvE '^docs/|\.md$' changed.txt; then
            docs_only=true
          fi
        fi
        echo "docs-only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  # A release pull request must bump completely and hold all of its base, as
  # the release is made only from the tree these checks ran on
  release-ready:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Require that a release pull request is complete and holds all of its base
      uses: refenv/gha-project-auto-release/ready@v1
      with:
        version-file: src/yace/__init__.py
        version-pattern: '^__version__ = "([^"]+)"$'

  format:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version: '3.12'

    - name: Install pre-commit
      run: |
        pipx install pre-commit --python python3
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run pre-commit
      run: |
        make format-all

  build:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version: '3.12'

    - name: Build tools
      run: |
        make deps
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build the sdist and wheel
      run: |
        make build

    - name: Upload the build
      uses: actions/upload-artifact@v6.0.0
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  devenv:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devenv.yml

  unittest-linux:
    needs: [format, build, devenv]
    runs-on: ubuntu-24.04
    env:
      CONTAINER: docker
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Download the build
      uses: actions/download-artifact@v7.0.0
      with:
        name: dist
        path: dist/

    - name: Log in to the registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Install the build and test it, in the devenv
      run: |
        make devenv-run CMD="make install test PYTHON=python${{ matrix.python-version }}"

  unittest-macos:
    needs: [format, build]
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download the build
      uses: actions/download-artifact@v7.0.0
      with:
        name: dist
        path: dist/

    - name: Install Zig
      uses: mlugg/setup-zig@v2.2.1
      with:
        version: 0.16.0
        use-cache: false

    - name: Install Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: 1.27.3
        cache: false

    - name: Install the build and test it
      run: |
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        make install test

  example:
    needs: [format, build, devenv]
    runs-on: ubuntu-24.04
    env:
      CONTAINER: docker
    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Download the build
      uses: actions/download-artifact@v7.0.0
      with:
        name: dist
        path: dist/

    - name: Log in to the registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Parse libfoo, emit its bindings, and build and run their checks, in the devenv
      run: |
        make devenv-run CMD="make install example"

    - name: Upload the emitted code
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: example-output
        path: output/
        if-no-files-found: ignore

  # The one check that main requires. It fails unless every job succeeded or
  # was skipped: release-ready outside a pull request, the rest for docs only.
  ci-result:
    needs: [changes, release-ready, format, build, devenv, unittest-linux, unittest-macos, example]
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Check the result of every job
      env:
        RESULTS: ${{ toJSON(needs) }}
        DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
      run: |
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
        skippable='"release-ready"'
        if [ "$DOCS_ONLY" = "true" ]; then
          skippable='"release-ready", "format", "build", "devenv", "unittest-linux", "unittest-macos", "example"'
        fi
        bad=$(jq -r "[to_entries[] | select(.value.result != \"success\")
          | select(.value.result != \"skipped\" or (.key | IN($skippable) | not))
          | .key] | join(\" \")" <<< "$RESULTS")
        if [ -n "$bad" ]; then
          echo "::error::Did not succeed: $bad"
          exit 1
        fi
