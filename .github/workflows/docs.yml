---
name: docs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - "main"

defaults:
  run:
    shell: bash

jobs:
  devenv:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devenv.yml

  build:
    needs: devenv
    runs-on: ubuntu-24.04
    env:
      CONTAINER: docker

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Log in to the registry
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    # yace from the checkout rather than PyPI, so the docs describe this tree
    - name: Build HTML, in the devenv
      run: |
        make devenv-run CMD="make docs"

    - name: Upload HTML
      uses: actions/upload-artifact@v6.0.0
      with:
        name: docs-html
        path: docs/builddir/html
        if-no-files-found: error

  deploy:
    # Deploy on pushes to main only; PR and dispatch builds stay artifacts-only
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/download-artifact@v7.0.0
      with:
        name: docs-html
        path: html/

    - uses: actions/configure-pages@v6

    - uses: actions/upload-pages-artifact@v5
      with:
        path: html/

    - id: deployment
      uses: actions/deploy-pages@v5
