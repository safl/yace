---
name: docs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - "main"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Grab source
      uses: actions/checkout@v5.0.1

    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version: '3.12'

    # The docs run yace on the example, so they need the C toolchain as well
    - name: System tools
      run: |
        sudo ./toolbox/pkgs/ubuntu.sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # yace from the checkout rather than PyPI, so the docs describe this tree
    - name: Build HTML
      run: |
        make docs

    - name: Upload HTML
      uses: actions/upload-artifact@v6.0.0
      with:
        name: docs-html
        path: docs/builddir/html
        if-no-files-found: error

  deploy:
    # Deploy on pushes to main only; PR and dispatch builds stay artifacts-only
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/download-artifact@v7.0.0
      with:
        name: docs-html
        path: html/

    - uses: actions/configure-pages@v6

    - uses: actions/upload-pages-artifact@v5
      with:
        path: html/

    - id: deployment
      uses: actions/deploy-pages@v5
