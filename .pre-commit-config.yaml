default_language_version:
  python: python3

repos:
- repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
  rev: 0.2.3
  hooks:
  - id: yamlfmt
    name: YAML-format
    args:
    - '--mapping=2'
    - '--sequence=2'
    - '--offset=0'
    - '--width=120'
    - '--preserve-quotes'
    types: [file]
    files: \.(yaml|yml|config|workflow)$

- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint
    name: GitHub-workflows-lint-actionlint

- repo: https://github.com/psf/black
  rev: 24.10.0
  hooks:
  - id: black
    name: Python-format-black

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.7.1
  hooks:
  - id: ruff
    name: Python-lint-ruff
    args: [--fix]

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.4.1
  hooks:
  - id: mypy
    name: Python-typecheck-mypy
    # Check src as a whole, by the [tool.mypy] in pyproject.toml
    pass_filenames: false
    additional_dependencies:
    - jinja2
    - pydantic>=2.0,<3.0
    - types-PyYAML

# Every file says its copyright and license, see REUSE.toml
- repo: https://github.com/fsfe/reuse-tool
  rev: v6.2.0
  hooks:
  - id: reuse
    name: REUSE-compliance
