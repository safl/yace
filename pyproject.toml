[build-system]
requires = ["setuptools>=60", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yace"
description = "yace aka Yet Another Code Emitter / Your Artisanal Code Emitter"
requires-python = ">=3.12"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Simon A. F. Lund", email = "os@safl.dk" }
]
maintainers = [
    { name = "Simon A. F. Lund", email = "os@safl.dk" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development",
    "Topic :: Text Processing",
    "Topic :: Utilities"
]
dependencies = [
    "jinja2",
    "pyyaml",
    "pydantic>=2.0,<3.0",
    "libclang~=14.0.1",
]
dynamic = ["version"]

[project.readme]
file = "README.rst"
content-type = "text/x-rst; charset=UTF-8"

[tool.setuptools.dynamic]
version = { attr = "yace.__version__" }

[project.optional-dependencies]
dev = [
    "coverage",
    "cython>=3.0",
    "kmdo",
    "pudb",
    "setuptools",
    "sphinx",
    "wheel",
]
all = ["yace[dev]"]

[project.scripts]
yace = "yace.cli.yace:main"

[project.entry-points."yace.targets"]
capi = "yace.targets.capi.target:CAPI"
python = "yace.targets.python.target:Python"
rust = "yace.targets.rust.target:Rust"
cpp = "yace.targets.cpp.target:CPP"
zig = "yace.targets.zig.target:Zig"
go = "yace.targets.go.target:Go"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yace" = ["**/*.template"]


[tool.ruff]
lint.select = ["E", "F", "I"]

[tool.pylsp]
[tool.pylsp.plugins]
rope = { enabled = true }

[tool.mypy]
files = ["src"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["clang", "clang.*"]
ignore_missing_imports = true

# The generators branch on what the idiom layer decided (an Arg's kind implies
# its type and which optional fields are set), which mypy cannot follow
[[tool.mypy.overrides]]
module = [
    "yace.targets.capi.*",
    "yace.targets.cpp.*",
    "yace.targets.go.*",
    "yace.targets.python.*",
    "yace.targets.rust.*",
    "yace.targets.zig.*",
]
disable_error_code = ["union-attr", "arg-type"]
