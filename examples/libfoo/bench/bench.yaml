doc: |
  The cost of calling libfoo from each target: a handle filled with
  FOO_POINTS_MAX points, the x of every point summed 'bench.rounds' times, by a
  call of foo_point_get() per point and by foo_point_visit() with a callback,
  in plain C and through the bindings yace generates for every target, the
  best of 'bench.repeat' runs of each. bench.toml says what is run; the run's
  output holds the facts of the machine, every command and what it printed,
  and the results, as artifacts/results.json, results.csv and report.txt.

  From examples/libfoo/bench, on this machine:

    cijoe bench.yaml -c bench.toml -o /tmp/bench

  On another, over ssh, with its address in transport.toml:

    cijoe bench.yaml -c bench.toml -c transport.toml -o /tmp/bench

steps:
- name: facts
  uses: core.facts_gather
  with:
    sections: os,kernel,system
- name: machine
  uses: bench_machine
- name: prepare
  uses: bench_prepare
- name: build
  uses: bench_build
- name: run
  uses: bench_run
- name: report
  uses: bench_report
