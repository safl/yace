doc: |
  Measures the cost of calling libfoo from each target. Each program sums the
  x of the FOO_POINTS_MAX points of a handle, by a call of foo_point_get() per
  point and by foo_point_visit() with a callback: in C, and through the
  bindings that yace generates. bench.toml sets what is run. The run's output
  holds the facts of the machine, every command with its output, and the
  results as artifacts/results.json, results.csv and report.txt.

  From examples/libfoo/bench, on this machine:

    cijoe bench.yaml -c bench.toml -o /tmp/bench

  On another machine, over ssh, with its address in transport.toml:

    cijoe bench.yaml -c bench.toml -c transport.toml -o /tmp/bench

steps:
- name: facts
  uses: core.facts_gather
  with:
    sections: os,kernel,system
- name: machine
  uses: bench_machine
- name: prepare
  uses: bench_prepare
- name: build
  uses: bench_build
- name: run
  uses: bench_run
- name: report
  uses: bench_report
