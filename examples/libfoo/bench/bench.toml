# What bench.yaml runs: each program's rounds are calibrated so that a run of
# its slowest way takes 'seconds', and each way is run 'repeat' times, the best
# kept, for each of 'targets'; at most 18 ways x 5 x 2 s, 3 minutes of runs.
# Give 'rounds' to fix the rounds instead
[bench]
seconds = 2
repeat = 5
targets = ["c", "cpp", "rust", "zig", "go", "python", "cython"]

# The commands, on the machine benchmarked, of yace and the toolchains; the
# Python must have Cython, meson-python, meson and ninja for the cython target
yace = "yace"
cc = "cc"
cxx = "c++"
rustc = "rustc"
cargo = "cargo"
zig = "zig"
go = "go"
python = "python3"

# The core every program is pinned to, and its clock in kHz, which bench_run
# pins through cpufreq for the run, with 'sudo' writing to it; leave them out
# where the machine is not set aside for the benchmark, and the results say the
# clock was not pinned
# cpu = 2
# khz = 2000000
# sudo = "sudo -n"

# A step that fails ends the run, rather than the next one running on what it
# did not make
[cijoe.task]
fail_fast = true
