# One run of a program's slowest way takes 'seconds': at most 18 ways x 5 x 2 s,
# 3 minutes. Set 'rounds' to skip the calibration.
[bench]
seconds = 2
repeat = 5
targets = ["c", "cpp", "rust", "zig", "go", "python", "cython"]

# The cython target needs Cython, meson-python, meson and ninja in the Python
yace = "yace"
cc = "cc"
cxx = "c++"
rustc = "rustc"
cargo = "cargo"
zig = "zig"
go = "go"
python = "python3"

# The core that every program is pinned to, and the kHz that its clock is pinned
# at through cpufreq; only for a machine set aside for the benchmark
# cpu = 2
# khz = 2000000
# sudo = "sudo -n"

# Each step uses what the step before it made
[cijoe.task]
fail_fast = true
