# Runs the benchmark over ssh, on a machine with yace and the toolchains of
# bench.toml on the PATH of an ssh command. Fill in its address and your key.
[cijoe.targets.bench.ssh]
username = "bench"
hostname = "bench.example.org"
port = 22
key_filename = "/home/user/.ssh/id_ed25519"

# Made afresh by each run
[bench]
workdir = "/tmp/yace-bench"
